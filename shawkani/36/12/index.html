<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فتح القدير — سورة يس، الآيات ١–١٢ | Mushafuk.online</title><meta name="description" content="تَفْسِيرُ سُورَةِ يس وهِيَ مَكِّيَّةٌ. قالَ القُرْطُبِيُّ: بِالإجْماعِ إلّا أنَّ فِرْقَةً قالَتْ ﴿ونَكْتُبُ ما قَدَّمُوا وآثارَهم﴾ [يس: ١٢] نَزَلَتْ في بَنِي سَ"><link rel="canonical" href="https://tafsir.mushafuk.online/shawkani/36/1/"><link rel="prev" href="https://tafsir.mushafuk.online/shawkani/35/36/"><link rel="next" href="https://tafsir.mushafuk.online/shawkani/36/13/"><link rel="icon" href="https://mushafuk.online/icon.png"><link rel="stylesheet" href="https://tafsir.mushafuk.online/saadi.css?v=3"><link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet"></head><body><header class="bar"><a class="x" href="https://tafsir.mushafuk.online/shawkani/" aria-label="إغلاق">×</a><div class="who"><h1 style="margin:0;font-size:1.15rem;font-weight:700;line-height:1.3;color:#1a3330"><b>يس</b></h1><small>الآيات ١–١٢</small></div></header><main id="tf"><p class="src">فتح القدير — الشوكاني</p><p class="ay cur" dir="rtl" lang="ar">إِنَّا نَحْنُ نُحْىِ ٱلْمَوْتَىٰ وَنَكْتُبُ مَا قَدَّمُوا۟ وَءَاثَـٰرَهُمْ ۚ وَكُلَّ شَىْءٍ أَحْصَيْنَـٰهُ فِىٓ إِمَامٍ مُّبِينٍ ﴿١٢﴾</p><div class="tx" lang="ar"><small class="rng">الآيات ١–١٢</small><p class="grp-jump">يُعرض تفسير هذه الآيات معاً في موضع واحد.</p><p class="grp-jump"><a class="btn-grp" href="/shawkani/36/1/">افتح تفسير الآيات ١–١٢ ←</a></p></div><nav class="pn"><a href="/shawkani/35/36/">المجموعة السابقة</a><a href="/shawkani/36/13/">المجموعة التالية</a></nav></main><script src="/turn.js?v=6" data-next="/shawkani/36/13/" data-prev="/shawkani/35/36/"></script></body></html>
