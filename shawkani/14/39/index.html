<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فتح القدير — سورة إبراهيم، الآيات ٣٥–٤١ | Mushafuk.online</title><meta name="description" content=". قَوْلُهُ: وإذْ قالَ إبْراهِيمُ مُتَعَلِّقٌ بِمَحْذُوفٍ: أيِ اذْكُرْ وقْتَ قَوْلِهِ، ولَعَلَّ المُرادَ بِسِياقِ ما قالَهُ إبْراهِيمُ عَلَيْهِ السَّلامُ في هَذا"><link rel="canonical" href="https://tafsir.mushafuk.online/shawkani/14/35/"><link rel="prev" href="https://tafsir.mushafuk.online/shawkani/14/28/"><link rel="next" href="https://tafsir.mushafuk.online/shawkani/14/42/"><link rel="icon" href="https://mushafuk.online/icon.png"><link rel="stylesheet" href="https://tafsir.mushafuk.online/saadi.css?v=3"><link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet"></head><body><header class="bar"><a class="x" href="https://tafsir.mushafuk.online/shawkani/" aria-label="إغلاق">×</a><div class="who"><h1 style="margin:0;font-size:1.15rem;font-weight:700;line-height:1.3;color:#1a3330"><b>إبراهيم</b></h1><small>الآيات ٣٥–٤١</small></div></header><main id="tf"><p class="src">فتح القدير — الشوكاني</p><p class="ay cur" dir="rtl" lang="ar">ٱلْحَمْدُ لِلَّهِ ٱلَّذِى وَهَبَ لِى عَلَى ٱلْكِبَرِ إِسْمَـٰعِيلَ وَإِسْحَـٰقَ ۚ إِنَّ رَبِّى لَسَمِيعُ ٱلدُّعَآءِ ﴿٣٩﴾</p><div class="tx" lang="ar"><small class="rng">الآيات ٣٥–٤١</small><p class="grp-jump">يُعرض تفسير هذه الآيات معاً في موضع واحد.</p><p class="grp-jump"><a class="btn-grp" href="/shawkani/14/35/">افتح تفسير الآيات ٣٥–٤١ ←</a></p></div><nav class="pn"><a href="/shawkani/14/28/">المجموعة السابقة</a><a href="/shawkani/14/42/">المجموعة التالية</a></nav></main><script src="https://tafsir.mushafuk.online/turn.js?v=4" data-next="https://tafsir.mushafuk.online/shawkani/14/40/" data-prev="https://tafsir.mushafuk.online/shawkani/14/38/"></script><script src="/turn.js?v=5" data-next="/shawkani/14/42/" data-prev="/shawkani/14/28/"></script></body></html>
